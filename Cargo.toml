[package]
name = "Z"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
log = {version = "0.4.34", features = ["release_max_level_trace", "std", "max_level_trace"]}
rand = "0.10.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(is_release)'] }

[profile.release]
debug-assertions = false
opt-level = 3

[profile.dev]
debug-assertions = true
opt-level = 0
